<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:B;font-weight:800;src:url(anuncio/fonts/bricolage-grotesque-latin-800-normal.woff2)}
@font-face{font-family:F;font-weight:700;src:url(anuncio/fonts/figtree-latin-700-normal.woff2)}
body{margin:0;width:1200px;height:630px;background:#F1ECFF;font-family:F;color:#22123A;position:relative;overflow:hidden}
.sun{position:absolute;right:-60px;top:40px;width:560px;height:560px;border-radius:50%;background:#FFE07A;opacity:.6}
.l{position:absolute;left:72px;top:64px;display:flex;align-items:center;gap:10px;font:800 46px B;letter-spacing:-.045em}
.l img{width:64px}
h1{position:absolute;left:72px;top:160px;margin:0;font:800 92px/.94 B;letter-spacing:-.05em;width:600px}
h1 em{font-style:normal;color:#FF5B2E}
p{position:absolute;left:72px;top:500px;margin:0;font-size:28px;color:#6A5C80;width:560px}
.tag{position:absolute;width:300px;padding:24px 22px 22px 52px;border-radius:10px 26px 26px 10px;box-shadow:0 20px 40px rgba(34,18,58,.14)}
.tag::before{content:"";position:absolute;left:18px;top:30px;width:16px;height:16px;border-radius:50%;background:#F1ECFF}
.tag b{display:block;font-size:24px}.tag i{font:800 44px B;font-style:normal;letter-spacing:-.03em}
</style></head><body><div class="sun"></div>
<div class="l"><img src="logo/presentinho-simbolo.svg">presentinho</div>

<div class="tag" style="right:110px;top:90px;background:#fff;transform:rotate(7deg)"><b>Passeio de barco</b><i>R$ 250,00</i></div>
<div class="tag" style="right:130px;top:280px;background:#FFE07A;transform:rotate(-8deg)"><b>Jantar na lua de mel</b><i>R$ 180,00</i></div>
<div class="tag" style="right:70px;top:420px;background:#FF5B2E;color:#fff;transform:rotate(4deg)"><b>Carrinho do bebê</b><i>R$ 400,00</i></div>
</body></html>
