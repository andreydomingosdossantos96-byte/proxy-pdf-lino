<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Feed · Calculadora</title>
<link rel="stylesheet" href="base.css">
<style>
  #s1 { background: var(--ameixa); color: var(--lilas); }
  .card { left: 90px; top: 360px; width: 900px; background: #2E1D4A; border-radius: 44px; padding: 50px 56px; }
  .lbl { font-size: 36px; font-weight: 700; color: #B7A9CC; }
  #val { font-family: "Bricolage"; font-weight: 800; font-size: 140px; letter-spacing: -0.04em; color: #fff; line-height: 1; margin: 10px 0 34px; font-variant-numeric: tabular-nums; }
  .track { position: relative; height: 18px; border-radius: 9px; background: #4A3768; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 9px; background: var(--mant); }
  #knob { position: absolute; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: #fff; box-shadow: 0 6px 16px rgba(0,0,0,.4); }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 44px; }
  #fee { font-family: "Bricolage"; font-weight: 800; font-size: 96px; letter-spacing: -0.04em; color: var(--tang); font-variant-numeric: tabular-nums; }
  #zero { left: 110px; right: 110px; top: 1000px; background: var(--tang); color: #fff; border-radius: 36px; padding: 34px 40px; text-align: center; z-index: 4; box-shadow: 0 24px 60px rgba(0,0,0,.4); }
  #zero small { display: block; font-size: 38px; font-weight: 700; }
  #zero b { display: block; font-family: "Bricolage"; font-weight: 800; font-size: 150px; letter-spacing: -0.05em; line-height: 1; }
</style></head>
<body><div id="stage">
  <section class="scene" id="s1">
    <p class="abs center disp hl" id="title" style="top:90px;font-size:80px">Quanto uma taxa de 3% leva da sua <em>lista?</em></p>
    <div class="abs card" id="card">
      <p class="lbl">Valor que seus convidados deram</p>
      <p id="val">R$ 2.000</p>
      <div class="track"><div id="fill"></div><div id="knob"></div></div>
      <div class="row"><span class="lbl" style="font-size:40px">Taxa de 3%</span><span id="fee">−R$ 60</span></div>
    </div>
    <div class="abs" id="zero"><small>No presentinho</small><b>R$ 0</b></div>
  </section>
  <section class="scene" id="end"></section>
  <canvas id="fx" width="1080" height="1350"></canvas>
</div>
<script src="base.js"></script>
<script>
$("end").innerHTML = END_HTML;
const SL = [1.3, 5.6], ZERO = 6.4, END = 9.4;
window.DURATION = 13;
window.MUSIC = { bpm: 124, prog: 3, start: 0.3 };
BURSTS = [{ t: ZERO + 0.2, x: 540, y: 1120, n: 140, kind: "confetti", seed: 31 }, { t: END + 0.4, x: 540, y: 440, n: 110, kind: "confetti", seed: 32 }];
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const valAt = t => 2000 + Math.round(ease(P(t, SL[0], SL[1])) * 18000 / 500) * 500;
const ticks = []; { let last = 2000; for (let t = SL[0]; t <= SL[1]; t += 1 / 30) { const v = valAt(t); if (v !== last) { ticks.push({ t, type: "tick", g: .28 }); last = v; } } }
window.EVENTS = [{ t: 0.05, type: "whoosh", g: .5 }, { t: 0.7, type: "whoosh", g: .4 }, ...ticks.filter((_, i) => i % 2 === 0),
  { t: ZERO + 0.18, type: "thud", g: 1 }, { t: ZERO + 0.2, type: "sparkle", g: .8 },
  { t: END - 0.05, type: "whoosh", g: .6 }, { t: END + 0.3, type: "sparkle", g: .8 }, { t: END + 0.9, type: "pop", g: .7 }];
function render(t) {
  $("s1").style.visibility = t < END + 0.45 ? "visible" : "hidden";
  const e = $("end"); e.style.visibility = t >= END ? "visible" : "hidden"; e.style.zIndex = 5;
  e.style.clipPath = t >= END && t < END + 0.42 ? `circle(${eo(P(t, END, END + 0.42)) * 1800}px at 50% 50%)` : "none";
  rise($("title"), t, 0, 0.35, 50);
  { const k = eo(P(t, 0.6, 1.1)); $("card").style.transform = `translateY(${(1 - k) * 900}px)`; }
  const v = valAt(t), pct = (v - 2000) / 18000;
  $("val").textContent = brl(v); $("fee").textContent = "−" + brl(v * 0.03);
  $("fill").style.width = (pct * 100) + "%"; $("knob").style.left = (pct * 100) + "%";
  $("knob").style.transform = `scale(${t > SL[0] && t < SL[1] ? 1.15 : 1})`;
  slam($("zero"), t, ZERO, 0.2, 2.4, -2);
  { const [dx, dy] = shakeXY(t, [ZERO + 0.18], 16); $("s1").style.translate = `${dx}px ${dy}px`; }
  endCard(t, END + 0.1);
  drawFx($("fx").getContext("2d"), t);
}
window.render = render;
</script></body></html>
