<style>
  /* Layout: festive landing (hero with swinging gift tags, occasions band, steps, editor with live phone
     preview, fees, FAQ). Gift tags are the brand symbol. Tokens mirror the Figma file "Presentinho". */
  :root {
    --fundo: #f1ecff;
    --superficie: #ffffff;
    --tinta: #22123a;
    --tinta-suave: #6a5c80;
    --linha: #ddd3f5;
    --tangerina: #ff5b2e;
    --sobre-tangerina: #ffffff;
    --manteiga: #ffe07a;
    --sobre-manteiga: #22123a;
    --menta: #12a67a;
    --sobre-menta: #ffffff;
    --faixa: #22123a;
    --sobre-faixa: #f1ecff;
    --veu: rgba(34, 18, 58, .62);
    --qr-bg: #ffffff;
    --qr-fg: #111111;
    --sombra: 0 2px 4px rgba(34, 18, 58, .06), 0 18px 40px rgba(34, 18, 58, .12);
    --f-display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
    --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fundo: #150b24; --superficie: #22163a; --tinta: #f3eeff; --tinta-suave: #b7a9cc; --linha: #3a2c55;
      --tangerina: #ff7a52; --sobre-tangerina: #1a0b05; --manteiga: #f5cf5a; --sobre-manteiga: #22123a;
      --menta: #3fd3a0; --sobre-menta: #06261b; --faixa: #2c1d4a; --sobre-faixa: #f3eeff; --veu: rgba(5, 2, 12, .7);
      --sombra: 0 2px 4px rgba(0,0,0,.4), 0 18px 40px rgba(0,0,0,.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --fundo: #150b24; --superficie: #22163a; --tinta: #f3eeff; --tinta-suave: #b7a9cc; --linha: #3a2c55;
    --tangerina: #ff7a52; --sobre-tangerina: #1a0b05; --manteiga: #f5cf5a; --sobre-manteiga: #22123a;
    --menta: #3fd3a0; --sobre-menta: #06261b; --faixa: #2c1d4a; --sobre-faixa: #f3eeff; --veu: rgba(5, 2, 12, .7);
    --sombra: 0 2px 4px rgba(0,0,0,.4), 0 18px 40px rgba(0,0,0,.45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--fundo); color: var(--tinta); font-family: var(--f-body); font-size: 17px; line-height: 1.55; overflow-x: hidden; }
  h1, h2, h3 { font-family: var(--f-display); font-weight: 800; letter-spacing: -0.035em; line-height: .95; text-wrap: balance; margin: 0; }
  p { margin: 0; }
  a { color: var(--tangerina); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--tangerina); outline-offset: 3px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
  .eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--tangerina); }

  /* ---------- logo ---------- */
  .brand { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--tinta); font-family: var(--f-display); font-weight: 800; letter-spacing: -0.045em; font-size: 1.6rem; line-height: 1; }
  .brand svg { width: 40px; height: 40px; flex: none; }
  .brand.small { font-size: 1.2rem; }
  .brand.small svg { width: 30px; height: 30px; }

  /* ---------- buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 15px 26px; font-weight: 700; font-size: 1rem; line-height: 1.2; border: 2px solid transparent; cursor: pointer; text-decoration: none; transition: transform .15s ease, filter .15s ease; text-align: center; }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--tangerina); color: var(--sobre-tangerina); }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-outline { background: transparent; border-color: var(--tinta); color: var(--tinta); }
  .btn-ok { background: var(--menta); color: var(--sobre-menta); }
  .btn-quiet { background: transparent; border-color: var(--linha); color: var(--tinta); padding: 9px 16px; font-size: .9rem; }
  .btn-quiet:hover { border-color: var(--tangerina); color: var(--tangerina); }
  .btn-block { width: 100%; }

  /* ---------- nav ---------- */
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 22px; }
  .nav-links { display: flex; align-items: center; gap: 30px; }
  .nav-links a:not(.btn) { color: var(--tinta); text-decoration: none; font-weight: 600; font-size: .95rem; }
  .nav-links a:not(.btn):hover { color: var(--tangerina); }
  .nav .btn { padding: 11px 20px; font-size: .92rem; white-space: nowrap; }
  @media (max-width: 420px) { .nav .btn { padding: 10px 14px; font-size: .85rem; } .brand { font-size: 1.35rem; } .brand svg { width: 34px; height: 34px; } }
  @media (max-width: 820px) { .nav-links a:not(.btn) { display: none; } }

  /* ---------- hero ---------- */
  .hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 32px; align-items: center; padding-block: 40px 96px; }
  @media (max-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr); padding-block: 16px 64px; } }
  .hero-text { display: grid; gap: 26px; justify-items: start; min-width: 0; }
  .seal { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: var(--superficie); border: 1px solid var(--linha); font-weight: 700; font-size: .88rem; }
  .seal i { width: 8px; height: 8px; border-radius: 50%; background: var(--menta); }
  .hero h1 { font-size: clamp(3.2rem, 8.6vw, 7.2rem); }
  .hero h1 em { font-style: normal; color: var(--tangerina); }
  .hero-lead { font-size: clamp(1.08rem, 1.8vw, 1.32rem); color: var(--tinta-suave); max-width: 34em; line-height: 1.5; }
  .cta-row { display: flex; flex-wrap: wrap; gap: 12px; }
  .fineprint { font-size: .88rem; font-weight: 600; color: var(--tinta-suave); }

  .pile { position: relative; height: 520px; min-width: 0; }
  @media (max-width: 900px) { .pile { height: 420px; max-width: 460px; width: 100%; justify-self: center; } }
  .pile .sun { position: absolute; inset: 8% 4% 6% 8%; border-radius: 50%; background: var(--manteiga); opacity: .55; }
  .sticker { position: absolute; width: min(250px, 58%); transform-origin: 22px 30px; animation: swing 5s ease-in-out infinite; }
  .sticker:nth-child(2) { left: 38%; top: 2%; --r: 7deg; animation-delay: -1.2s; }
  .sticker:nth-child(3) { left: 0; top: 27%; --r: -10deg; animation-delay: -2.4s; }
  .sticker:nth-child(4) { left: 40%; top: 50%; --r: 5deg; animation-delay: -3.6s; }
  @keyframes swing { 0%, 100% { transform: rotate(var(--r, 0deg)); } 50% { transform: rotate(calc(var(--r, 0deg) + 4deg)); } }
  .toast-card { position: absolute; left: 2%; bottom: 0; z-index: 2; display: flex; gap: 12px; align-items: center; background: var(--faixa); color: var(--sobre-faixa); border-radius: 18px; padding: 14px 18px 14px 14px; transform: rotate(-3deg); box-shadow: var(--sombra); max-width: 92%; }
  .toast-card svg { width: 30px; height: 30px; flex: none; }
  .toast-card strong { display: block; font-size: .95rem; }
  .toast-card span { font-size: .82rem; opacity: .75; }
  /* Celular: as etiquetas viram uma pilha em coluna, sem sobreposição */
  @media (max-width: 900px) {
    .pile { height: auto; display: grid; gap: 30px; padding-block: 20px 8px; }
    .pile .sun { inset: auto; left: 8%; top: 50%; width: 84%; aspect-ratio: 1; transform: translateY(-50%); }
    .pile > .sticker, .pile > .toast-card { position: relative; left: auto; top: auto; bottom: auto; width: 74%; max-width: 300px; }
    .pile > .sticker:nth-child(2), .pile > .sticker:nth-child(4) { justify-self: end; }
    .pile > .sticker:nth-child(3), .pile > .toast-card { justify-self: start; }
    .pile > .toast-card { width: auto; max-width: 100%; }
    .pile > .sticker { transform-origin: 50% 0; }
    .pile > .sticker:nth-child(2) { --r: 3deg; }
    .pile > .sticker:nth-child(3) { --r: -4deg; }
    .pile > .sticker:nth-child(4) { --r: 2deg; }
  }

  /* ---------- gift tag ---------- */
  .tag { position: relative; display: grid; gap: 8px; text-align: left; background: var(--manteiga); color: var(--sobre-manteiga); border: 0; border-radius: 8px 22px 22px 8px; padding: 20px 18px 18px 42px; min-width: 0; box-shadow: var(--sombra); }
  .tag::before { content: ""; position: absolute; left: 15px; top: 24px; width: 13px; height: 13px; border-radius: 50%; background: var(--fundo); box-shadow: inset 0 1px 2px rgba(0,0,0,.18); }
  .tag-name { font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .tag-price { font-family: var(--f-display); font-weight: 800; font-size: 1.75rem; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .tag-cta { font-size: .8rem; font-weight: 700; opacity: .7; }
  .tag.white { background: var(--superficie); color: var(--tinta); }
  .tag.orange { background: var(--tangerina); color: var(--sobre-tangerina); }
  .tag.free { background: transparent; color: var(--tinta); border: 2px dashed var(--tinta-suave); box-shadow: none; }
  .tag.free .tag-price { font-size: 1.25rem; }
  button.tag { cursor: pointer; font: inherit; transition: transform .18s ease; transform-origin: 22px 30px; }
  button.tag:hover { transform: rotate(-2.5deg) translateY(-2px); }

  /* ---------- band ---------- */
  .band { background: var(--faixa); color: var(--sobre-faixa); overflow: hidden; padding-block: 24px; }
  .band-track { display: flex; width: max-content; animation: marquee 32s linear infinite; }
  .band-track span { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.5rem, 3vw, 2.3rem); letter-spacing: -0.03em; white-space: nowrap; display: inline-flex; align-items: center; gap: 28px; padding-right: 28px; }
  .band-track svg { width: 22px; height: 22px; flex: none; }
  @keyframes marquee { to { transform: translateX(-50%); } }

  /* ---------- sections ---------- */
  .section { padding-block: 112px; display: grid; gap: 44px; }
  @media (max-width: 700px) { .section { padding-block: 72px; gap: 32px; } }
  .section-head { display: grid; gap: 14px; max-width: 760px; }
  .section h2 { font-size: clamp(2.4rem, 5.4vw, 4.2rem); }
  .section-head p { color: var(--tinta-suave); font-size: 1.12rem; max-width: 38em; }
  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; list-style: none; margin: 0; padding: 0; }
  @media (max-width: 860px) { .steps { grid-template-columns: minmax(0, 1fr); } }
  .steps li { background: var(--superficie); border: 1px solid var(--linha); border-radius: 28px; padding: 30px; display: grid; gap: 12px; align-content: start; }
  .num { width: 54px; height: 54px; border-radius: 50%; background: var(--manteiga); color: var(--sobre-manteiga); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; }
  .steps h3 { font-size: 1.85rem; letter-spacing: -0.03em; }
  .steps p { color: var(--tinta-suave); }

  /* ---------- editor ---------- */
  .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 32px; align-items: start; }
  @media (max-width: 960px) { .workspace { grid-template-columns: minmax(0, 1fr); } }
  .panels { display: grid; gap: 16px; min-width: 0; }
  .panel { background: var(--superficie); border: 1px solid var(--linha); border-radius: 24px; padding: 24px; display: grid; gap: 18px; min-width: 0; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .panel-head h3 { font-size: 1.45rem; letter-spacing: -0.025em; display: flex; align-items: center; gap: 10px; }
  .panel-head h3 .num { width: 34px; height: 34px; font-size: 1.05rem; }
  .chip-ex { font-size: .76rem; font-weight: 700; background: var(--manteiga); color: var(--sobre-manteiga); padding: 4px 10px; border-radius: 999px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
  .field { display: grid; gap: 6px; min-width: 0; }
  .field label { font-size: .88rem; font-weight: 700; }
  .hint { font-size: .8rem; color: var(--tinta-suave); }
  .err { font-size: .82rem; color: var(--tangerina); font-weight: 700; }
  input[type=text], input[type=date], input[type=tel], select, textarea { width: 100%; min-width: 0; background: var(--fundo); border: 1.5px solid transparent; border-radius: 14px; padding: 12px 14px; }
  textarea { resize: vertical; min-height: 84px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--tangerina); background: var(--superficie); }
  .items { display: grid; gap: 10px; }
  .item-row { display: grid; grid-template-columns: minmax(0, 1fr) 128px 44px; gap: 8px; align-items: center; }
  .money { text-align: right; font-variant-numeric: tabular-nums; }
  .icon-btn { width: 44px; height: 46px; border-radius: 14px; border: 1.5px solid var(--linha); background: transparent; color: var(--tinta-suave); cursor: pointer; display: grid; place-items: center; }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn:hover { color: var(--tangerina); border-color: var(--tangerina); }
  .row-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: .95rem; cursor: pointer; }
  .check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--tangerina); }
  .total { font-size: .9rem; color: var(--tinta-suave); font-variant-numeric: tabular-nums; }
  .total strong { color: var(--tinta); }
  .form-error { color: var(--tangerina); font-weight: 700; }
  .share { display: grid; gap: 12px; background: var(--fundo); border: 2px solid var(--menta); border-radius: 18px; padding: 18px; }
  .copy-line { display: flex; gap: 8px; min-width: 0; }
  .copy-line input { flex: 1; font-family: var(--f-mono); font-size: .8rem; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn-row .btn { padding: 11px 18px; font-size: .92rem; }

  .preview-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); display: grid; gap: 10px; min-width: 0; }
  @media (max-width: 960px) { .preview-col { position: static; } }
  .preview-label { display: flex; justify-content: space-between; font-size: .76rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-suave); }
  .phone { border: 10px solid var(--faixa); border-radius: 40px; background: var(--fundo); height: min(780px, calc(100vh - 90px)); overflow-y: auto; box-shadow: var(--sombra); }
  @media (max-width: 960px) { .phone { height: auto; max-height: 760px; } }
  .phone .guest { padding: 18px 14px 28px; }

  /* ---------- fees / faq / final ---------- */
  .fees { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  @media (max-width: 860px) { .fees { grid-template-columns: minmax(0, 1fr); } }
  .fee-card { background: var(--tangerina); color: var(--sobre-tangerina); border-radius: 32px; padding: 44px; display: grid; gap: 22px; align-content: start; }
  .fee-vs { display: flex; flex-wrap: wrap; gap: 20px 44px; align-items: end; }
  .fee-vs div { display: grid; gap: 4px; }
  .fee-vs b { font-family: var(--f-display); font-weight: 800; font-size: clamp(3.4rem, 7vw, 5.6rem); letter-spacing: -0.05em; line-height: .9; font-variant-numeric: tabular-nums; }
  .fee-vs .old { opacity: .55; }
  .fee-vs .old b { text-decoration: line-through; text-decoration-thickness: 5px; }
  .fee-vs span { font-weight: 600; }
  .safe-card { background: var(--superficie); border: 1px solid var(--linha); border-radius: 32px; padding: 44px; display: grid; gap: 16px; align-content: start; }
  .safe-card h3 { font-size: clamp(1.8rem, 3vw, 2.4rem); }
  .safe-card p { color: var(--tinta-suave); }
  .faq { display: grid; gap: 12px; max-width: 860px; }
  .faq details { background: var(--superficie); border: 1px solid var(--linha); border-radius: 20px; padding: 0 24px; }
  .faq summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 16px; align-items: center; padding-block: 20px; font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; letter-spacing: -0.02em; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; font-size: 1.6rem; color: var(--tangerina); line-height: 1; }
  .faq details[open] summary::after { content: "–"; }
  .faq details p { color: var(--tinta-suave); padding-bottom: 22px; max-width: 60ch; }
  .final { background: var(--faixa); color: var(--sobre-faixa); text-align: center; }
  .final .wrap { padding-block: 104px; display: grid; gap: 28px; justify-items: center; }
  .final h2 { font-size: clamp(2.6rem, 6.4vw, 5.2rem); max-width: 14ch; }
  .foot-links { display: inline-flex; flex-wrap: wrap; gap: 16px; justify-content: center; font-size: .85rem; }
  .foot-links a { color: var(--tinta-suave); }
  .footer { padding-block: 28px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; color: var(--tinta-suave); font-size: .9rem; }

  /* ---------- guest page ---------- */
  .guest { max-width: 760px; margin: 0 auto; display: grid; gap: 22px; }
  .guest-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: .85rem; color: var(--tinta-suave); font-weight: 600; }
  .guest-head { display: grid; gap: 12px; padding-top: 8px; }
  .guest-head h1 { font-size: clamp(3rem, 12vw, 5.4rem); overflow-wrap: anywhere; }
  .phone .guest-head h1 { font-size: 3.2rem; }
  .guest-head .msg { color: var(--tinta-suave); white-space: pre-line; overflow-wrap: anywhere; font-size: 1.05rem; }
  .receiver { display: flex; gap: 12px; align-items: flex-start; background: var(--superficie); border: 1px solid var(--linha); border-radius: 18px; padding: 14px 16px; font-size: .92rem; }
  .receiver svg { width: 22px; height: 22px; flex: none; color: var(--menta); }
  .tags { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  @media (max-width: 480px) { .guest .tag { padding: 18px 12px 14px 32px; } .guest .tag::before { left: 11px; top: 21px; width: 11px; height: 11px; } .guest .tag-price { font-size: 1.3rem; } .guest .tag.free .tag-price { font-size: 1rem; } }
  .phone .tags { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .phone .tag { padding: 18px 12px 14px 32px; box-shadow: none; }
  .phone .tag::before { left: 11px; top: 21px; width: 11px; height: 11px; }
  .phone .tag-price { font-size: 1.3rem; }

        field("rcCity", "Cidade", bind("rcCity", () => state.r.ci, v => state.r.ci = v, "input", { maxlength: "30" }))),
      field("hostWa", "Seu WhatsApp (opcional)", bind("hostWa", () => state.w, v => state.w = v, "input", { type: "tel", inputmode: "tel", placeholder: "(11) 98765-4321" }), "Para o convidado avisar que pagou e mandar um recado."));

    const itemsBox = el("div", { class: "items" });
    const drawItems = () => {

    const giftsPanel = el("section", { class: "panel" }, head("3", "Os presentes", totalEl), itemsBox,

    const generate = () => {

      if (k.error) problems.push("a chave Pix");

        el("p", { class: "hint", text: "Guarde esse link. Os dados da lista ficam dentro dele; para mudar algo, edite aqui e gere um link novo." }));

      el("aside", { class: "preview-col" }, el("div", { class: "preview-label" }, el("span", { text: "Como o convidado vê" }), el("span", { text: "toque num presente" })), preview));

  }

              el("div", null, el("strong", { text: "Pix recebido · R$ 180,00" }), el("span", { text: "Tia Marta: “Aproveitem o jantar!”" }))))))
      ,

  function exampleUrl() {
    const s = JSON.parse(JSON.stringify(EXAMPLE)); delete s.ex;
    return siteBase() + "#" + encodeState(s);

  /* ================= Boot ================= */
  let mode = null;
  function boot() {
    const s = decodeState(location.hash);
    const app = document.getElementById("app");
    if (s) {
      mode = "guest";
      document.title = (s.n ? s.n + " · " : "") + "Lista de presentes";
      app.replaceChildren(el("div", { class: "wrap", style: "padding-block:20px 48px" }, renderGuest(s, { preview: false })));
    } else if (location.hash.startsWith("#v1.")) {
      mode = "guest";
      app.replaceChildren(el("div", { class: "wrap", style: "padding-block:40px" }, el("div", { class: "guest" },
        el("p", { class: "alert", text: "Link incompleto. Peça para quem te enviou mandar o link de novo, inteiro." }),
        el("a", { class: "btn btn-outline", href: siteBase(), text: "Criar minha lista" }))));
    } else if (mode !== "landing") {
      mode = "landing";
      renderLanding();
    }
  }
  window.addEventListener("hashchange", () => {
    if (location.hash.startsWith("#v1.") || mode === "guest") { document.getElementById("sheetRoot").replaceChildren(); boot(); }
  });
  boot();
})();
